services:
  app:
    build:
      context: .
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: Host=database;Port=5432;Database=tokeneater;Username=tokeneater;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      Smtp__Host: mailpit
      Smtp__Port: 1025
      Smtp__EnableSsl: "false"
      Smtp__FromAddress: no-reply@token-eater.local
      Smtp__FromName: Token Eater
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy
      mailpit:
        condition: service_started

  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tokeneater
      POSTGRES_USER: tokeneater
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tokeneater -d tokeneater"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-18025}:8025"

volumes:
  postgres_data:
